[package]
name = "core"
version = "0.1.0"
edition = "2021"
description = "Flutter Installer core: SDK, Dart, Flutter, PATH, Process and System managers"

[dependencies]
anyhow = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["gzip", "json"] }

[lib]
name = "core"